<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Complete Supplier Evaluation</title><link rel="stylesheet" href="/styles.css" /></head>
<body><main class="wrap narrow"><div class="brand"><span class="mark">SE</span><div><small>SUPPLIER EVALUATION</small><h1>Evaluation form</h1></div></div><p class="subtitle">This private link is intended for one evaluator.</p><div id="notice" role="status" aria-live="polite"></div><section id="formCard" class="panel" hidden><div id="details"></div><form id="evaluationForm" class="form-grid"><label>Overall rating (1–5)<select id="rating" required><option value="">Choose a rating</option><option value="1">1 — Very poor</option><option value="2">2 — Poor</option><option value="3">3 — Fair</option><option value="4">4 — Good</option><option value="5">5 — Excellent</option></select></label><label>Comments<textarea id="comments" rows="4" maxlength="2000" placeholder="Optional feedback"></textarea></label><button class="primary" type="submit">Submit evaluation</button></form></section><p class="footer">Do not forward your private evaluation link.</p></main><script type="module" src="/evaluate.js"></script></body></html>
